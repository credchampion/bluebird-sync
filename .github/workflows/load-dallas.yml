name: Load Dallas homes

on:
  workflow_dispatch:
  schedule:
    - cron: "47 9 * * *"

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]==3.2.*"
      - run: python loader/dallas.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
